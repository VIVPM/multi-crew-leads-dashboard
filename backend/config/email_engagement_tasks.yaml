email_drafting_and_optimization:
  description: >
    Craft a highly personalized email using the lead's name, job title,
    company information, and any relevant personal or company achievements.
    The email should speak directly to the lead's interests and the needs
    of their company, and include strong CTAs and engagement hooks that
    encourage the lead to schedule a meeting or take another desired action
    immediately.

    This is not cold outreach — it's a follow-up to a lead form, so keep it
    short and to the point. Don't use any salutations or closing remarks,
    nor too complex sentences. Keep in mind they reached out and filled a
    lead form.

    Our Company and Product:
    {our_company_context}

    Use the following information:
    Personal Info: {personal_info}
    Company Info: {company_info}
    Lead Score: {lead_score}
  expected_output: >
    A personalized, ready-to-send email draft that:
    - Includes a subject line, greeting, body, closing line, and sign off.
    - Addresses the lead by name and acknowledges their role and company.
    - Highlights how our product can meet their specific needs or interests.
    - Includes a strong call to action and an engagement hook that
      encourages an immediate response.
