# CI checks backend, frontend, containers, and gated deployment.
name: CI

on:
  push:
    branches:
      - main
      - 'langgraph**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          pip install ruff==0.14.4
          ruff check backend/ tests/

      - name: Syntax check
        run: python -m py_compile backend/*.py tests/*.py

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Unit tests (no network)
        run: |
          python tests/test_security.py
          python tests/test_pipeline.py
          python tests/test_queue_policy.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BACKEND_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          build-args: VITE_BACKEND_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          FRONTEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$BACKEND_HOOK" ] && [ -z "$FRONTEND_HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK_* secrets set — skipping deploy."
            echo "Render's own auto-deploy-on-push may already cover this; if so,"
            echo "turn it off there so deploys are gated on CI rather than racing it."
            exit 0
          fi
          for hook in "$BACKEND_HOOK" "$FRONTEND_HOOK"; do
            if [ -n "$hook" ]; then
              curl --fail --silent --show-error -X POST "$hook" > /dev/null
              echo "Triggered deploy."
            fi
          done
