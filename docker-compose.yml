# Local API, worker, and frontend services backed by remote Supabase.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      RUN_WORKER_IN_PROCESS: "0"
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "backend/worker.py"]
    env_file: backend/.env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BACKEND_URL: "http://localhost:8000"
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
