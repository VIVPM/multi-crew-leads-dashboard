server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: React Router owns the URL space, so any path that is not a
    # real file has to return index.html rather than nginx's 404 — otherwise a
    # refresh on /dashboard 404s even though the route exists client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so a changed file is a changed URL and
    # caching forever is safe. index.html deliberately is not cached (below),
    # since it is what points at the current fingerprints.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
